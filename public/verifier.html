<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>MAF GAME — Vérifier un code</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 20px;
      background: radial-gradient(circle at 50% 0%, #273e65, #0e1729 68%); color: #f6f9ff; font: 16px system-ui, sans-serif; }
    main { width: min(450px,100%); padding: 28px; border-radius: 24px; border: 1px solid #ffffff3b;
      background: #ffffff0c; box-shadow: 0 24px 90px #0006; }
    small { color:#a4e8ff; font-weight: 800; letter-spacing: .16em; }
    h1 { font-size: clamp(27px,7vw,34px); margin: 14px 0 10px; }
    p { color: #c4d1e2; line-height: 1.5; }
    label { display:block; margin: 24px 0 8px; font-weight: 750; }
    input { display: block; width:100%; padding:16px 12px; border:1px solid #ffffff69; border-radius:13px;
      background:#ffffff12; color:#fff; font:700 26px/1.2 ui-monospace,monospace; text-align:center; letter-spacing:.15em; }
    input:focus { outline:2px solid #98eaff; outline-offset:2px; }
    button { display:block; width:100%; margin-top:14px; min-height:51px; border:0; border-radius:13px;
      background:#a0eaff; color:#101c2c; font:800 16px system-ui; cursor:pointer; }
    button:disabled { opacity:.55; cursor:wait; }
    #message { min-height:35px; font-weight:600; }
  </style>
</head>
<body>
  <main>
    <small>MAF GAME</small>
    <h1>Vérifier un code</h1>
    <p>Entre le code numérique transmis dans ton invitation. Aucun compte et aucune connexion ne sont nécessaires.</p>
    <form id="verificationForm">
      <label for="secretCode">Code secret</label>
      <input id="secretCode" type="text" inputmode="numeric" pattern="[0-9]{4,12}" minlength="4" maxlength="12"
        autocomplete="one-time-code" enterkeyhint="send" placeholder="000000" required aria-describedby="message">
      <button id="sendButton" type="submit">Envoyer le code</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
  </main>
  <script>
    // Cette page reste 100 % autonome : HTML + CSS + JavaScript, sans backend embarqué.
    const API = 'https://maf-game-backend.onrender.com';
    const form = document.getElementById('verificationForm');
    const input = document.getElementById('secretCode');
    const button = document.getElementById('sendButton');
    const message = document.getElementById('message');
    input.addEventListener('input', () => { input.value = input.value.replace(/\D/g, '').slice(0, 12); });
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const code = input.value.trim();
      if (!/^[0-9]{4,12}$/.test(code)) { message.textContent = 'Entre un code de 4 à 12 chiffres.'; return; }
      button.disabled = true; message.textContent = 'Envoi en cours…';
      try {
        const response = await fetch(API + '/api/premium-verification/submit', {
          method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({code})
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw Error(data.error || 'Envoi impossible pour le moment.');
        message.textContent = 'Code transmis. Le propriétaire pourra le consulter dans ses notifications.';
        form.reset();
      } catch (error) { message.textContent = error.message; }
      finally { button.disabled = false; }
    });
  </script>
</body>
</html>
