<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>MAF GAME — Espace indépendant</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 24px;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif; color: #ecf7ff;
      background: radial-gradient(circle at 50% 15%, #203e5b, #0b1420 65%); }
    main { width: min(100%, 440px); padding: 30px; text-align: center;
      border: 1px solid #ffffff30; border-radius: 23px;
      background: #ffffff0b; backdrop-filter: blur(15px); }
    small { color: #92dffc; font-weight: 700; letter-spacing: .16em; }
    h1 { margin: 12px 0; font-size: clamp(27px, 7vw, 38px); }
    p { color: #b9ccdb; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <small>MAF GAME</small>
    <h1>Page prête</h1>
    <p>Cette page HTML est indépendante du jeu. Son contenu sera ajouté prochainement.</p>
  </main>
</body>
</html>
